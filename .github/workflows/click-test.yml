# 진단용: diag 브랜치에 올리면 exe 를 만들어 실제 클릭 점검만 함 (Release 는 안 올림)
name: Click test
on:
  push:
    branches: [diag]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pillow pyinstaller
      - run: pyinstaller --onefile --noconsole --name PhotoCursor --exclude-module tkinter photo_cursor.py
      - name: Real click test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force t | Out-Null
          Copy-Item dist/PhotoCursor.exe, normal.png, click.png t/
          (Get-Content settings.txt -Encoding utf8) -replace '^SHOW_START_MESSAGE = .*','SHOW_START_MESSAGE = no' | Set-Content t/settings.txt -Encoding utf8
          $env:PYTHONIOENCODING = "utf-8"
          $env:PHOTOCURSOR_DEBUG = "$PWD\debug.log"
          python tests/click_test.py "$PWD\t"; $code = $LASTEXITCODE
          "---- debug.log ----"; Get-Content debug.log -Encoding utf8 -ErrorAction SilentlyContinue
          exit $code
